# ─────────────────────────────────────────────────────────
# nginx.conf — Configuração do servidor para NuxDiet
# ─────────────────────────────────────────────────────────
#
# Configurações aplicadas:
#   - Compressão gzip: reduz tamanho dos arquivos transferidos
#   - Cache de arquivos estáticos: melhora performance
#   - Página de erro customizada: redireciona 404 para index.html
# ─────────────────────────────────────────────────────────

server {
    listen 80;
    server_name localhost;

    # Diretório raiz dos arquivos do site
    root /usr/share/nginx/html;
    index index.html;

    # Compressão gzip — reduz tamanho dos arquivos enviados ao browser
    gzip on;
    gzip_types text/plain text/css application/javascript text/html;
    gzip_min_length 256;

    # Cache para arquivos estáticos (CSS, JS, imagens)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Rota principal — serve index.html para qualquer rota
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Página de erro 404 — redireciona para o index
    error_page 404 /index.html;
}
