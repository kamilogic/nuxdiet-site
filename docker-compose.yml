# ─────────────────────────────────────────────────────────
# docker-compose.yml — Orquestração local do NuxDiet
# ─────────────────────────────────────────────────────────
#
# Permite rodar o site localmente via Docker sem precisar
# instalar nginx ou qualquer outro servidor web.
#
# Uso:
#   docker-compose up --build    → builda a imagem e sobe o container
#   docker-compose up -d         → sobe em background
#   docker-compose down          → para e remove o container
#   docker-compose logs          → ver logs do nginx
#
# Acesso: http://localhost:8080
# ─────────────────────────────────────────────────────────

services:
  nuxdiet:
    # Builda a imagem a partir do Dockerfile na pasta atual
    build:
      context: .
      dockerfile: Dockerfile

    # Nome do container para fácil identificação
    container_name: nuxdiet-site

    # Mapeia porta 8080 do host para porta 80 do container
    # Acesse: http://localhost:8080
    ports:
      - "8080:80"

    # Reinicia automaticamente se o container cair
    restart: unless-stopped

    # Variáveis de ambiente (para referência futura)
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80

    # Healthcheck — verifica se o nginx está respondendo
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
