name: CI/CD — NuxDiet

# Dispara em push e pull request para a branch main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Variáveis globais reutilizadas em todos os jobs
env:
  AWS_REGION: us-east-1
  S3_BUCKET: nuxdiet-static-site
  TF_VERSION: "1.7.0"
  # Registro de imagens Docker do GitHub (gratuito)
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ─────────────────────────────────────────────────────────
  # JOB 1 — VALIDATE
  # Integração Contínua: valida código e IaC a cada push/PR.
  # Não precisa de credenciais AWS ou Docker.
  # ─────────────────────────────────────────────────────────
  validate:
    name: "1 · Validar código (CI)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout — baixa o código do repositório
        uses: actions/checkout@v4

      - name: Verificar estrutura de arquivos HTML
        run: |
          echo "=== Arquivos do site ==="
          ls -la src/
          test -f src/index.html || (echo "ERRO: index.html não encontrado" && exit 1)
          test -f src/style.css  || (echo "ERRO: style.css não encontrado"  && exit 1)
          grep -q "<!DOCTYPE html>" src/index.html || (echo "ERRO: DOCTYPE ausente" && exit 1)
          grep -q "<title>"         src/index.html || (echo "ERRO: tag title ausente" && exit 1)
          echo "✅ HTML válido"

      - name: Verificar arquivos de container
        # Garante que os arquivos Docker estão presentes antes de qualquer build
        run: |
          test -f Dockerfile      || (echo "ERRO: Dockerfile não encontrado" && exit 1)
          test -f docker-compose.yml || (echo "ERRO: docker-compose.yml não encontrado" && exit 1)
          test -f nginx.conf      || (echo "ERRO: nginx.conf não encontrado" && exit 1)
          echo "✅ Arquivos de container presentes"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt — verifica formatação
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Terraform init — sem backend (apenas validação)
        run: terraform init -backend=false
        working-directory: terraform

      - name: Terraform validate — valida sintaxe e lógica
        run: terraform validate
        working-directory: terraform


  # ─────────────────────────────────────────────────────────
  # JOB 2 — DOCKER
  # Entrega Contínua: builda e publica a imagem Docker no
  # GitHub Container Registry (ghcr.io) a cada push para main.
  #
  # A imagem pode ser usada para rodar o site em qualquer
  # ambiente que suporte Docker — local, servidor, cloud.
  # ─────────────────────────────────────────────────────────
  docker:
    name: "2 · Build e Push da imagem Docker (CD)"
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # Permissão para publicar no GitHub Container Registry
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        # Autentica no ghcr.io usando o token automático do GitHub Actions
        # Não precisa criar conta no Docker Hub — ghcr.io é gratuito
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados da imagem
        # Gera automaticamente tags e labels para a imagem:
        # - Tag com o SHA do commit (ex: sha-abc1234)
        # - Tag "latest" para o push mais recente
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build e Push da imagem Docker
        # Builda a imagem usando o Dockerfile e publica no ghcr.io
        # A imagem fica disponível em: ghcr.io/kamilogic/nuxdiet-site
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Resumo do build
        run: |
          echo "### 🐳 Imagem Docker publicada" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** ghcr.io" >> $GITHUB_STEP_SUMMARY
          echo "**Imagem:** ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Para rodar localmente:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker run -p 8080:80 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY


  # ─────────────────────────────────────────────────────────
  # JOB 3 — INFRA
  # Provisiona ou atualiza a infraestrutura AWS via Terraform.
  # Roda em paralelo com o job Docker após o validate.
  # ─────────────────────────────────────────────────────────
  infra:
    name: "3 · Provisionar infraestrutura (Terraform)"
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    outputs:
      cloudfront_id: ${{ steps.tf_output.outputs.cloudfront_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Cache do estado Terraform
        uses: actions/cache@v4
        with:
          path: terraform/terraform.tfstate
          key: terraform-state-main
          restore-keys: terraform-state-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init
        working-directory: terraform

      - name: Terraform plan
        run: terraform plan -lock=false
        working-directory: terraform

      - name: Terraform apply
        run: terraform apply -auto-approve -lock=false
        working-directory: terraform

      - name: Capturar outputs do Terraform
        id: tf_output
        run: |
          echo "cloudfront_id=$(terraform output -raw cloudfront_id)" >> $GITHUB_OUTPUT
        working-directory: terraform


  # ─────────────────────────────────────────────────────────
  # JOB 4 — DEPLOY
  # Entrega Contínua: publica os arquivos no S3 e invalida
  # o cache do CloudFront. Roda após infra estar pronta.
  # ─────────────────────────────────────────────────────────
  deploy:
    name: "4 · Deploy do site para S3 (CD)"
    runs-on: ubuntu-latest
    needs: infra
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Sincronizar arquivos com S3
        run: |
          aws s3 sync src/ s3://${{ env.S3_BUCKET }}/ \
            --delete \
            --cache-control "max-age=3600"
          echo "✅ Arquivos enviados para S3"

      - name: Invalidar cache do CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.infra.outputs.cloudfront_id }} \
            --paths "/*"
          echo "✅ Cache invalidado — site atualizado"

      - name: Resumo do deploy
        run: |
          echo "### 🚀 Deploy concluído" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Bucket S3:** ${{ env.S3_BUCKET }}" >> $GITHUB_STEP_SUMMARY
          echo "**CloudFront ID:** ${{ needs.infra.outputs.cloudfront_id }}" >> $GITHUB_STEP_SUMMARY
